version: "3.8"

services:
  # ----------------------------------------------------------------------------
  # Next.js Frontend Service
  # ----------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: ../docker/frontend.Dockerfile
    container_name: feedback-frontend-dev
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - NODE_ENV=development
      - NEXT_PUBLIC_API_BASE_URL=http://localhost:8000/api/v1
    depends_on:
      - django-api
      - ml-service
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    networks:
      - feedback-net

  # ----------------------------------------------------------------------------
  # Django Core Application API Service
  # ----------------------------------------------------------------------------
  django-api:
    build:
      context: .
      dockerfile: docker/django.Dockerfile
    container_name: feedback-django-api-dev
    ports:
      - "8000:8000"
    environment:
      - DJANGO_DEBUG=True
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY:-dev-insecure-secret-key-change-in-production-only}
      - DJANGO_ALLOWED_HOSTS=localhost,127.0.0.1,0.0.0.0,django-api,testserver
      - DJANGO_CORS_ALLOWED_ORIGINS=http://localhost:3000,http://127.0.0.1:3000
      - ML_SERVICE_URL=http://ml-service:8001
      - ENVIRONMENT=development
    volumes:
      - django_data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health/"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    networks:
      - feedback-net

  # ----------------------------------------------------------------------------
  # FastAPI ML & NLP Inference Service
  # ----------------------------------------------------------------------------
  ml-service:
    build:
      context: .
      dockerfile: docker/fastapi.Dockerfile
    container_name: feedback-ml-service-dev
    ports:
      - "8001:8001"
    environment:
      - FASTAPI_ENVIRONMENT=development
      - FASTAPI_LOG_LEVEL=INFO
      - FASTAPI_PORT=8001
      - FASTAPI_CORS_ORIGINS=http://localhost:3000,http://localhost:8000,http://django-api:8000
      - MODEL_CACHE_DIR=/app/models_cache
    volumes:
      - ml_models:/app/models_cache
      - topic_artifacts:/app/app/artifacts/topics
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    networks:
      - feedback-net

volumes:
  django_data:
  ml_models:
  topic_artifacts:

networks:
  feedback-net:
    driver: bridge
