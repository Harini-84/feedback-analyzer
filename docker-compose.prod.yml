version: "3.8"

services:
  # ----------------------------------------------------------------------------
  # PostgreSQL 16 Production Database
  # ----------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: feedback-postgres-prod
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-feedback_db}
      POSTGRES_USER: ${POSTGRES_USER:-feedback_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ChangeThisInProductionSecurely123!}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-feedback_admin} -d ${POSTGRES_DB:-feedback_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - feedback-net-prod

  # ----------------------------------------------------------------------------
  # FastAPI ML & NLP Inference Microservice
  # ----------------------------------------------------------------------------
  ml-service:
    build:
      context: .
      dockerfile: docker/fastapi.Dockerfile
    container_name: feedback-ml-service-prod
    restart: always
    environment:
      - FASTAPI_ENVIRONMENT=production
      - FASTAPI_LOG_LEVEL=INFO
      - FASTAPI_PORT=8001
      - FASTAPI_CORS_ORIGINS=http://localhost:3000,http://django-api:8000
      - MODEL_CACHE_DIR=/app/models_cache
      - FASTAPI_DEVICE=cpu
    volumes:
      - ml_models_prod:/app/models_cache
      - topic_artifacts_prod:/app/app/artifacts/topics
    ports:
      - "8001:8001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - feedback-net-prod

  # ----------------------------------------------------------------------------
  # Django Core Application API Gateway (Gunicorn WSGI)
  # ----------------------------------------------------------------------------
  django-api:
    build:
      context: .
      dockerfile: docker/django.Dockerfile
    container_name: feedback-django-api-prod
    restart: always
    environment:
      - DJANGO_DEBUG=False
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY:?Error: DJANGO_SECRET_KEY must be set in production}
      - DJANGO_ALLOWED_HOSTS=${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,django-api,0.0.0.0}
      - DJANGO_CORS_ALLOWED_ORIGINS=${DJANGO_CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      - DB_ENGINE=postgresql
      - DB_NAME=${POSTGRES_DB:-feedback_db}
      - DB_USER=${POSTGRES_USER:-feedback_admin}
      - DB_PASSWORD=${POSTGRES_PASSWORD:-ChangeThisInProductionSecurely123!}
      - DB_HOST=postgres
      - DB_PORT=5432
      - ML_SERVICE_URL=http://ml-service:8001
      - ENVIRONMENT=production
    depends_on:
      postgres:
        condition: service_healthy
      ml-service:
        condition: service_healthy
    volumes:
      - django_static_prod:/app/staticfiles
      - django_media_prod:/app/data
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health/"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - feedback-net-prod

  # ----------------------------------------------------------------------------
  # Next.js Frontend Dashboard Service (Standalone Runner)
  # ----------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: ../docker/frontend.Dockerfile
    container_name: feedback-frontend-prod
    restart: always
    environment:
      - PORT=3000
      - NODE_ENV=production
      - NEXT_PUBLIC_API_BASE_URL=${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000/api/v1}
    ports:
      - "3000:3000"
    depends_on:
      django-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - feedback-net-prod

volumes:
  postgres_data:
  ml_models_prod:
  topic_artifacts_prod:
  django_static_prod:
  django_media_prod:

networks:
  feedback-net-prod:
    driver: bridge
